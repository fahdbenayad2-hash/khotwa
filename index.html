<body>
  <div id="app" aria-live="polite">
    <div class="loading"><span class="loader"></span><span>نفتح مساحتك...</span></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
<script>/* KHOTWA persistence: IndexedDB primary; localStorage fallback for unsupported/opaque origins. */
window.KhotwaDB = (() => {
  const DB_NAME='khotwa-database';
  const VERSION=2;
  const TABLES=['tasks','projects','habits','habitLogs','sessions','reviews','meta'];
  let db=null;
  let fallback=false;
  let fallbackCache=null;

  function localRead() {
    if (fallbackCache) return fallbackCache;
    try { fallbackCache=JSON.parse(localStorage.getItem('khotwa-local-data')||'{}'); }
    catch (_) { fallbackCache={}; }
    for (const table of TABLES) if (!Array.isArray(fallbackCache[table])) fallbackCache[table]=[];
    return fallbackCache;
  }
  function localWrite(table,record,del) {
    const data=localRead();
    const next=structuredClone(data);
    next[table]=next[table].filter(x=>x.id!==record.id);
    if (!del) next[table].push(structuredClone(record));
    try {localStorage.setItem('khotwa-local-data',JSON.stringify(next));fallbackCache=next;}
    catch (err) { throw Error('فشل حفظ البيانات على الجهاز؛ تحقق من مساحة التخزين.'); }
  }
  async function open(){
    if (!('indexedDB' in window)) { fallback=true; localRead(); return; }
    try {
      db=await new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,VERSION);
        request.onupgradeneeded=()=>{
          const database=request.result, tx=request.transaction;
          for(const table of TABLES){
            if(!database.objectStoreNames.contains(table))database.createObjectStore(table,{keyPath:'id'});
          }
          // Non-destructive migration from the original v1 stores.
          if((request.transaction?.db?.version || VERSION)>=2){
            const indexes={tasks:['plannedDate','projectId','status'],sessions:['startedAt','endedAt'],habitLogs:['date']};
            for(const [table,keys] of Object.entries(indexes)){
              const store=tx.objectStore(table);
              for(const key of keys)if(!store.indexNames.contains(key))store.createIndex(key,key,{unique:false});
            }
          }
        };
        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
        request.onblocked=()=>reject(Error('قاعدة البيانات مستعملة من نافذة أخرى'));
      });
    } catch (err) {
      // Existing IndexedDB records must never silently be replaced by an empty fallback.
      if(err?.name==='SecurityError'||err?.name==='InvalidStateError'){
        fallback=true;localRead();console.warn('IndexedDB denied; using localStorage:',err);
      }else throw Error('تعذر فتح قاعدة البيانات. اغلق نوافذ خُطوة الأخرى وحدّث الصفحة. '+(err?.message||''));
    }
  }
  async function all(table) {
    if (!TABLES.includes(table)) throw Error('Invalid table');
    if (fallback) return structuredClone(localRead()[table]);
    return new Promise((resolve,reject)=>{
      const request=db.transaction(table).objectStore(table).getAll();
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
  }
  async function put(table,record) {
    if (!TABLES.includes(table)) throw Error('Invalid table');
    if (fallback) return localWrite(table,record,false);
    return new Promise((resolve,reject)=>{
      const transaction=db.transaction(table,'readwrite');
      transaction.objectStore(table).put(structuredClone(record));
      transaction.oncomplete=()=>resolve();
      transaction.onerror=()=>reject(transaction.error);
    });
  }
  async function remove(table,id) {
    if (!TABLES.includes(table)) throw Error('Invalid table');
    if (fallback) return localWrite(table,{id},true);
    return new Promise((resolve,reject)=>{
      const transaction=db.transaction(table,'readwrite');
      transaction.objectStore(table).delete(id);
      transaction.oncomplete=()=>resolve();
      transaction.onerror=()=>reject(transaction.error);
    });
  }
  async function replaceAll(content) {
    if (fallback) {
      const next={};
      for(const table of TABLES)next[table]=structuredClone(content[table]||[]);
      localStorage.setItem('khotwa-local-data',JSON.stringify(next));
      fallbackCache=next;
      return;
    }
    return new Promise((resolve,reject)=>{
      const transaction=db.transaction(TABLES,'readwrite');
      for (const table of TABLES) {
        const store=transaction.objectStore(table);
        store.clear();
        for (const row of content[table]||[]) store.put(structuredClone(row));
      }
      transaction.oncomplete=()=>resolve();
      transaction.onerror=()=>reject(transaction.error);
    });
  }
  return {TABLES,open,all,put,remove,replaceAll,get fallback(){return fallback;}};
})();
</script>

async function putTask(values,id){
 const old=id?atTask(id):null;
 const t={id:id||uid(),title:titleCase(values.title),nextStep:values.nextStep.trim(),projectId:values.projectId||null,deadline:values.deadline||null,role:old?.role||'secondary',plannedDate:old?.plannedDate||null,status:old?.status||'todo',createdAt:old?.createdAt||now(),updatedAt:now(),completedAt:old?.completedAt||null};
 if(values.planning==='today'){
  const asPrimary=values.role==='primary'||(!assignedToday().some(x=>x.id!==id&&x.role==='primary')&&t.role!=='primary');
  const ok=await scheduleToday(t,asPrimary);
  if(!ok)return false;
 }else{t.plannedDate=null;t.role='secondary';}
 await persist('tasks',t);return true;
}
async function scheduleToday(t,asPrimary=false){
 const others=assignedToday().filter(x=>x.id!==t.id);
 if(asPrimary){
  const previous=others.find(x=>x.role==='primary');
  if(previous){
   if(others.length>=3){const evict=others.filter(x=>x.role!=='primary').at(-1);if(evict){await persist('tasks',{...evict,plannedDate:null,role:'secondary',updatedAt:now()});notify('انتقلت مهمة مساعدة للصندوق حفاظاً على تركيز اليوم.');}}
   await persist('tasks',{...previous,role:'secondary',updatedAt:now()});
  }else if(others.length>=3){const evict=others.at(-1);await persist('tasks',{...evict,plannedDate:null,role:'secondary',updatedAt:now()});}
  t.role='primary';
 }else{
  if(others.length>=3){notify('اليوم فيه 3 مهام. أكمل واحدة أو غيّر ترتيب يومك أولاً.');return false;}
  t.role=others.some(x=>x.role==='primary')?'secondary':'primary';
 }
 t.plannedDate=today();return true;
}

}
function clockNow(){return timerAnchor?timerAnchor.wall+(performance.now()-timerAnchor.mono):Date.now();}
function resetTimerAnchor(){timerAnchor={wall:Date.now(),mono:performance.now()};}
function secondsRemaining(){
 if(!active)return 0;
 const elapsed=((active.pausedAt||clockNow())-active.startedAt-active.pausedMs)/1000;
 return Math.max(0,Math.ceil(active.durationSec-elapsed));
}
function actualSeconds(){return active?Math.max(0,Math.floor(((active.pausedAt||clockNow())-active.startedAt-active.pausedMs)/1000)):0;}
function formatClock(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function updateTimer(){
 if(!active)return;
 const remaining=secondsRemaining();const clock=$('#focus-time');
 if(clock)clock.textContent=formatClock(remaining);
 if(remaining===0&&!active.finished){active.finished=true;setMeta('focus',active).then(()=>render()).catch(errorToast);}
}

 resetTimerAnchor();

async function togglePause(){

 else active.pausedAt=clockNow();

}

async function closeFocus(outcome){

function jsonBackup(){const result={app:'KHOTWA',version:2,schemaVersion:2,exportedAt:now()};for(const t of tables)result[t]=state[t];return result;}
async function exportFile(){
 const json=JSON.stringify(jsonBackup(),null,2);
 const blob=new Blob([json],{type:'application/json;charset=utf-8'}), url=URL.createObjectURL(blob), a=document.createElement('a');
 a.href=url;a.download=`khotwa-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
 await setMeta('lastBackupAt',now());
 render();notify('بدأ تنزيل النسخة الاحتياطية. تأكد من حفظ الملف في مكان آمن.');

function validateBackup(data){
 if(!data||data.app!=='KHOTWA'||![1,2].includes(data.version)|| (data.schemaVersion!==undefined&&![1,2].includes(data.schemaVersion)))throw Error('نسخة غير متوافقة. نقبل نسخ KHOTWA v1 وv2 فقط.');
 const out={};let count=0;
 for(const table of tables){
  if(!Array.isArray(data[table]))throw Error('النسخة ناقصة أو غير صحيحة: '+table);
  if(data[table].length>100000)throw Error('هذا الملف يحتوي على سجلات أكثر من الحد المسموح.');
  const seen=new Set();out[table]=data[table].map(item=>{
   if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id||item.id.length>200||seen.has(item.id))throw Error('سجلات غير صالحة في '+table);
   seen.add(item.id);return item;
  });count+=data[table].length;
 }
 if(count>100000)throw Error('ملف أكبر من الحد المسموح.');
 // Explicit shape checks protect ordinary backup imports from malformed records.
 for(const t of out.tasks)if(typeof t.title!=='string'||!['todo','done'].includes(t.status)||t.title.length>2000)throw Error('نسخة المهام غير صالحة.');
 for(const p of out.projects)if(typeof p.name!=='string'||p.name.length>2000)throw Error('نسخة المشاريع غير صالحة.');
 for(const h of out.habits)if(typeof h.title!=='string'||h.title.length>2000)throw Error('نسخة العادات غير صالحة.');
 for(const r of out.sessions)if(!Number.isFinite(r.actualMinutes)||r.actualMinutes<0||r.actualMinutes>1440)throw Error('نسخة الجلسات غير صالحة.');
 for(const t of out.tasks){
   if(t.plannedDate!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(t.plannedDate))throw Error('تاريخ مهمة غير صالح.');
   if(t.nextStep!=null&&typeof t.nextStep!=='string')throw Error('خطوة مهمة غير صالحة.');
 }
 for(const m of out.meta)if(m.id==='focus'&&m.value!=null&&(!Number.isFinite(m.value.startedAt)||!Number.isFinite(m.value.durationSec)||m.value.durationSec<=0||m.value.durationSec>86400))throw Error('جلسة التركيز في النسخة غير صالحة.');
 return out;
}
async function importFile(file){
 if(!file)return;
 if(file.size>3*1024*1024)throw Error('الملف كبير جداً. أقصى حجم 3MB.');
 const text=await file.text();let data;try{data=JSON.parse(text);}catch(_){throw Error('الملف JSON غير صالح.');}
 const validated=validateBackup(data);
 if(state.tasks.length||state.projects.length||state.sessions.length||state.habits.length){
  if(!confirm('الاستيراد سيستبدل بياناتك الحالية. ننصح بتنزيل نسخة احتياطية الآن. هل تريد تنزيلها قبل المتابعة؟'))return;
  await exportFile();
 }
 if(!confirm('تأكد أنك حفظت النسخة الاحتياطية قبل الاستبدال. هل تريد استيراد الملف الآن؟'))return;
 await DB.replaceAll(validated);
 for(const t of tables)state[t]=await DB.all(t);
 theme=getMeta('theme')==='light'?'light':'dark';document.documentElement.classList.toggle('light',theme==='light');
 active=getMeta('focus')||null;
 if(active&&(!Number.isFinite(active.startedAt)||!Number.isFinite(active.durationSec)))active=null;
 resetTimerAnchor();
 page='today';projectDetail=null;render();if(active)startTick();notify('تم استرجاع النسخة الاحتياطية بنجاح.');
}

 if(typed!=='حذف')return;
 const blank=Object.fromEntries(tables.map(t=>[t,[]]));await DB.replaceAll(blank);for(const t of tables)state[t]=[];
 active=null;theme='dark';document.documentElement.classList.remove('light');projectDetail=null;page='today';render();notify('تم حذف بيانات هذا المتصفح.');
}
async function handleAction(action,node){

 switch(action){
 case 'nav':page=node.dataset.page;projectDetail=null;closeModal();render();scrollTo(0,0);break;
 case 'theme':theme=theme==='dark'?'light':'dark';document.documentElement.classList.toggle('light',theme==='light');await setMeta('theme',theme);render();break;
 case 'task-new':openModal({type:'task',projectId:node.dataset.project||null});break;
 case 'task-edit':openModal({type:'task',id});break;
 case 'task-delete':if(confirm('تحذف هذه المهمة نهائياً؟')){await erase('tasks',id);closeModal();render();notify('حذفنا المهمة.');}break;
 case 'today-add':{const t=atTask(id);if(!t)return;const ok=await scheduleToday(t,!currentPrimary());if(ok){await persist('tasks',{...t,updatedAt:now()});render();notify('أضفنا المهمة لليوم.');}break;}
 case 'toggle-task':{const t=atTask(id);if(!t)return;const isDone=t.status==='done';await persist('tasks',{...t,status:isDone?'todo':'done',completedAt:isDone?null:now(),updatedAt:now()});render();notify(isDone?'رجّعنا المهمة للقائمة.':'سجلنا إنجازك ✨');break;}
 case 'project-new':openModal({type:'project'});break;
 case 'project-edit':openModal({type:'project',id});break;
 case 'project-open':projectDetail=id;render();scrollTo(0,0);break;
 case 'project-back':projectDetail=null;render();break;
 case 'project-delete':if(confirm('حذف المشروع؟ ستبقى المهام لكن دون مشروع.')){
  for(const t of state.tasks.filter(t=>t.projectId===id))await persist('tasks',{...t,projectId:null,updatedAt:now()});
  await erase('projects',id);closeModal();projectDetail=null;render();notify('تم حذف المشروع، والمهام بقيت محفوظة.');}break;
 case 'habit-new':openModal({type:'habit'});break;
 case 'habit-edit':openModal({type:'habit',id});break;
 case 'habit-delete':if(confirm('حذف هذه العادة وجميع سجلاتها؟')){for(const log of state.habitLogs.filter(l=>l.habitId===id))await erase('habitLogs',log.id);await erase('habits',id);closeModal();render();}break;
 case 'habit-toggle':{const key=`${id}|${today()}`;if(state.habitLogs.some(l=>l.id===key))await erase('habitLogs',key);else await persist('habitLogs',{id:key,habitId:id,date:today(),createdAt:now()});render();break;}
 case 'inbox-filter':inboxFilter=node.dataset.value;render();break;
 case 'focus-setup':openModal({type:'focus',id,duration:5,rescue:false});break;
 case 'focus-quick':{const task=atTask(id);if(task)await launchFocus(task.id,task.nextStep||task.title,300);break;}
 case 'backup-dismiss':await setMeta('backupReminderDismissedAt',now());render();break;
 case 'rescue':{const t=currentPrimary()||assignedToday()[0]||activeTasks()[0];if(t)openModal({type:'focus',id:t.id,duration:2,rescue:true});else openModal({type:'task'});break;}
 case 'duration':modal.draftStep=$('#focus-step')?.value;modal.duration=Number(node.dataset.duration);drawModal();break;
 case 'focus-start':await startFocus();break;
 case 'focus-pause':await togglePause();break;
 case 'focus-finish':await finishFocus();break;
 case 'focus-end':await closeFocus(node.dataset.outcome);break;
 case 'modal-close':closeModal();break;
 case 'export':await exportFile();break;
 case 'import':$('#import-file')?.click();break;
 case 'reset':await clearEverything();break;
 }
}
async function handleForm(form){
 const values=Object.fromEntries(new FormData(form).entries());
 if(form.id==='quick-form')return addQuick(values.title,'today');
 if(form.id==='inbox-form')return addQuick(values.title,'inbox');
 if(form.id==='review-form'){
  await persist('reviews',{id:weekStart(),win:values.win.trim(),block:values.block.trim(),next:values.next.trim(),createdAt:state.reviews.find(r=>r.id===weekStart())?.createdAt||now(),updatedAt:now()});render();notify('حفظنا المراجعة الأسبوعية.');return;
 }
 if(form.id!=='editor-form')return;
 if(form.dataset.kind==='task'){
  if(!titleCase(values.title||''))return notify('أدخل عنوان المهمة.');
  if(!await putTask(values,modal.id))return;
  closeModal();render();notify('تم حفظ المهمة.');
 }
 if(form.dataset.kind==='project'){
  if(!titleCase(values.name||''))return notify('أدخل اسم المشروع.');
  const p=state.projects.find(x=>x.id===modal.id);
  await persist('projects',{id:p?.id||uid(),name:titleCase(values.name),outcome:values.outcome.trim(),createdAt:p?.createdAt||now(),updatedAt:now()});closeModal();render();notify('تم حفظ المشروع.');
 }
 if(form.dataset.kind==='habit'){
  if(!titleCase(values.title||''))return notify('أدخل اسم العادة.');
  const h=state.habits.find(x=>x.id===modal.id);
  await persist('habits',{id:h?.id||uid(),title:titleCase(values.title),createdAt:h?.createdAt||now(),updatedAt:now()});closeModal();render();notify('تم حفظ العادة.');
 }
}
async function boot(){
 try{
  await DB.open();
  for(const table of tables)state[table]=await DB.all(table);
  theme=getMeta('theme')==='light'?'light':'dark';
  document.documentElement.classList.toggle('light',theme==='light');
  active=getMeta('focus')||null;
  if(active&&(!Number.isFinite(active.startedAt)||!Number.isFinite(active.durationSec)||active.durationSec<=0||active.durationSec>86400))active=null;
  resetTimerAnchor();
  render();if(active)startTick();
  if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
   navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('PWA offline not registered:',err));
  }
 }catch(e){console.error(e);$('#app').innerHTML=`<div class="loading" style="display:grid;text-align:center;align-content:center"><strong>تعذر فتح خُطوة</strong><p>${esc(e.message)}</p><button class="btn secondary" onclick="location.reload()">حاول مجدداً</button></div>`;}
}
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-action]');if(!node)return;
 e.preventDefault();handleAction(node.dataset.action,node).catch(errorToast);
});
document.addEventListener('submit',e=>{e.preventDefault();handleForm(e.target).catch(errorToast);});
document.addEventListener('change',e=>{
 if(e.target.id==='import-file'){importFile(e.target.files?.[0]).catch(errorToast);e.target.value='';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){closeModal();}});
// Midnight turnover: old tasks stay saved and won't become today's obligations.
let dayAtRender=today();setInterval(()=>{if(today()!==dayAtRender){dayAtRender=today();render();}},60_000);
boot();
})();
</script>
